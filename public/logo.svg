<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  
  <!-- Chain links representing blockchain -->
  <g fill="#ffd700" stroke="#ffd700" stroke-width="1.5">
    <!-- First chain link -->
    <ellipse cx="20" cy="24" rx="6" ry="4" fill="none"/>
    <ellipse cx="28" cy="24" rx="6" ry="4" fill="none"/>
    
    <!-- Second chain link -->
    <ellipse cx="24" cy="32" rx="4" ry="6" fill="none"/>
    <ellipse cx="24" cy="40" rx="4" ry="6" fill="none"/>
    
    <!-- Third chain link -->
    <ellipse cx="36" cy="32" rx="6" ry="4" fill="none"/>
    <ellipse cx="44" cy="32" rx="6" ry="4" fill="none"/>
  </g>
  
  <!-- Hexagon representing hive structure -->
  <g fill="#00d4ff" stroke="#00d4ff" stroke-width="2">
    <polygon points="32,16 40,20 40,28 32,32 24,28 24,20" fill="none"/>
    <polygon points="32,44 38,46 38,52 32,54 26,52 26,46" fill="none"/>
    <polygon points="44,40 48,44 48,50 44,52 40,50 40,44" fill="none"/>
  </g>
  
  <!-- Central connecting node -->
  <circle cx="32" cy="32" r="3" fill="#ffd700"/>
  
  <!-- Text indicator -->
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#00d4ff">CH</text>
</svg>